<!DOCTYPE html>
<html>
<head>
        <!-- Favicon -->
        <link
        rel="shortcut icon"
        href="{{ url_for('static', filename='img/favicon.ico') }}"
      />
      <!-- Bootstrap 3.3.7 -->
      <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/bootstrap.css') }}"
      />
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,600,700,300italic,400italic,600italic"
      />
    <title>Switch Port Statuses</title>
    <!-- <link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"> -->
    {% extends "bootstrap/base.html" %}
    {% block head %}
        {{ super() }}
    {% endblock %}

</head>
{% block body %}
<body>
    <div class="container-fluid bg-light">
        <div class="row">
          <div class="col-md-4">
            <h1>Port Statuses</h1>
          </div>
          <div class="col-md-8">
            <form class="float-right" method="POST" action=" ">
              <div class="form-row">
                <div class="form-group col-md-3 my-2">
                  <input
                    type="Hostname"
                    class="form-control"
                    placeholder="Hostname"
                    name="hostname"
                    required
                  />
                </div>
                <div class="form-group col-md-1 my-2">
                  <input
                    type="Port"
                    class="form-control"
                    placeholder="Port"
                    name="port"
                    value="22"
                  />
                </div>
                <div class="form-group col-md-3 my-2">
                  <input
                    type="Username"
                    class="form-control"
                    placeholder="Username"
                    name="username"
                    required
                  />
                </div>
                <div class="form-group col-md-3 my-2">
                  <input
                    type="password"
                    class="form-control"
                    placeholder="Password"
                    name="password"
                    required
                  />
                </div>
                <div class="form-group col-md-2 my-2">
                  <button type="submit" class="btn btn-primary col">
                    Connect
                  </button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
    <div class="col-md-4 mt-3">
        <form method="POST" action=" ">
          <div class="form-row">
            <div class="form-group col-md-6 my-2">
              <input
                type="text"
                class="form-control"
                placeholder="GigabitEthernet1/0/3"
                name="port"
                required
              />
            </div>
            <div class="form-group col-md-4 my-2">
              <button type="submit" class="btn btn-primary col">
                Turn on Port
              </button>
            </div>
          </div>
        </form>
      </div>
        {% if statuses %}
        <div class="container">
            <section class="content">
              <table
                class="table table-responsive-sm table-bordered table-hover mt-5"
              >
                <thead class="thead-light">
                    <tr>
                        <th>Port</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    {% for port, status in statuses.items() %}
                  <tr>
                    <tr>
                        <td>{{ port }}</td>
                        <td>{{ status }}</td>
                    </tr>
                  </tr>
                  {% endfor %}
                </tbody>
              </table>
            </section>
          </div>
        {% endif %}
        <script src="{{ url_for('static', filename='js/jquery-3.3.1.js') }}"></script>
        <script src="{{ url_for('static', filename='js/bootstrap.js') }}"></script>
</body>
{% endblock %}
</html>
